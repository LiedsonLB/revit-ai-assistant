services:
  db:
    image: pgvector/pgvector:pg16
    container_name: revit_ai_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-revit_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-revit_ai}
      POSTGRES_DB: ${POSTGRES_DB:-revit_ai}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-revit_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: revit_ai_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-revit_ai}:${POSTGRES_PASSWORD:-revit_ai}@db:5432/${POSTGRES_DB:-revit_ai}
      REVIT_BRIDGE_URL: ${REVIT_BRIDGE_URL:-http://host.docker.internal:5005}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    container_name: revit_ai_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

volumes:
  db_data:
